[package]
name = "rust-service"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
ckb-hash = "=1.0.0"
ckb-sdk = "=5.0.0"
ckb-types = "=1.0.0"
# ckb-sdk 5.0.0 was released against the 1.0.0 CKB crate family.
# Keep the family atomic: newer 1.x transitive releases use molecule 0.9,
# while this SDK still generates types against molecule 0.8.
ckb-chain-spec = "=1.0.0"
ckb-crypto = "=1.0.0"
ckb-dao-utils = "=1.0.0"
ckb-jsonrpc-types = "=1.0.0"
ckb-mock-tx-types = "=1.0.0"
ckb-resource = "=1.0.0"
ckb-script = "=1.0.0"
ckb-traits = "=1.0.0"
dotenvy = "0.15"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
secp256k1 = { version = "0.30.0", features = ["recovery"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "uuid", "json", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace", "request-id", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["postgres", "blocking"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
